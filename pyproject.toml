[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorguard-pyhsm"
version = "1.9.0"
description = "Production-grade software Key Management Service (KMS) — key lifecycle, authenticated encryption, digital signing, and tamper-evident audit logging."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Pavon Dunbar"},
]
keywords = ["hsm", "kms", "cryptography", "key-management", "encryption", "signing", "audit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=43.0.0,<51.0.0",
    "argon2-cffi>=23.1.0,<25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
]

[project.urls]
Homepage = "https://github.com/pavondunbar/PyHSM"
Repository = "https://github.com/pavondunbar/PyHSM"
Issues = "https://github.com/pavondunbar/PyHSM/issues"

[project.scripts]
vectorguard-pyhsm = "cli:main"

[tool.setuptools.packages.find]
include = ["hsm*"]

[tool.setuptools]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hsm --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["hsm"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "pass",
]

[tool.setuptools.package-data]
hsm = ["py.typed"]

# PyHSM hash-pinned dependency lockfile.
#
# All packages are pinned to exact versions AND verified by SHA-256 hash.
# pip will refuse to install any package whose hash does not match, defending
# against:
#   - Compromised PyPI mirrors serving modified packages
#   - Supply-chain attacks where a package is altered after publication
#   - Network MITM during installation
#
# Usage:
#   pip install --require-hashes -r requirements.lock
#
# IMPORTANT: --require-hashes is only enforced when this flag is passed
# explicitly. Add it to your Dockerfile, CI pipeline, and deployment scripts.
#
# Regenerating this file:
#   pip-compile --generate-hashes pyproject.toml -o requirements.lock
# or manually:
#   pip download --no-deps --dest /tmp/wheels <package>==<version>
#   python3 -c "import hashlib; print('sha256:' + hashlib.sha256(open('/tmp/wheels/<file>','rb').read()).hexdigest())"
#
# Cross-platform notes:
#   Multiple hashes are listed per package to cover Linux x86_64, Linux aarch64,
#   macOS (arm64 + x86_64), and Windows amd64. pip selects the correct wheel for
#   the target platform automatically; only the matching hash is checked.
#
# Last updated: 2026-10-01

